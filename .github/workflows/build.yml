name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint (TypeScript check)
        run: npx tsc --noEmit 2>&1 || true

      - name: Lint (WXT prepare)
        run: npx wxt prepare 2>&1

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          cd .output/chrome-mv3
          zip -r ../../aria-page-agent.zip .
          cd ../..
          echo "=== Zip contents ==="
          unzip -l aria-page-agent.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria-page-agent-extension
          path: .output/chrome-mv3/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: aria-page-agent-zip
          path: aria-page-agent.zip
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          cd .output/chrome-mv3
          zip -r ../../aria-page-agent.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aria-page-agent.zip
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
