name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint (TypeScript check)
        run: npx tsc --noEmit 2>&1 || true

      - name: Lint (WXT prepare)
        run: npx wxt prepare 2>&1

      - name: Build extension
        run: npm run build

      - name: List build output
        run: |
          echo "=== Build output ==="
          find .output -type f 2>/dev/null || echo "No .output directory"
          echo "=== Root files ==="
          ls -la *.zip 2>/dev/null || echo "No zip files"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria-page-agent-extension
          path: |
            .output/
            !.output/**/node_modules
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Create zip
        run: |
          if command -v wxt &> /dev/null; then
            npx wxt zip || true
          fi
          if [ ! -f *.zip ]; then
            cd .output/chrome-mv3 && zip -r ../../aria-page-agent.zip . && cd ../..
          fi
          ls -la *.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-page-agent-zip
          path: "*.zip"
          if-no-files-found: warn
          retention-days: 30
